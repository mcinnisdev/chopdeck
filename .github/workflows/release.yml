# Desktop builds. Push a tag like v0.2.0 (npm version minor && git push --follow-tags) and this builds the
# same web bundle into installers for Windows, macOS (Apple silicon and Intel) and Linux, attached to a
# draft GitHub Release named after the tag. Publish the draft when you are happy with it.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            targets: ''
          - platform: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux webview and bundling dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Chop Deck v__VERSION__'
          releaseBody: |
            The desktop app: the same machine as chopdeck.com, working entirely offline.
            Windows: the .msi or .exe installer. macOS: the .dmg for your chip (aarch64 for Apple silicon, x64 for Intel). Linux: .AppImage, .deb or .rpm.
            These builds are not code-signed yet: macOS will ask you to right-click and choose Open the first time; Windows SmartScreen will ask you to confirm.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
