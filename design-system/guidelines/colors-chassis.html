<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}</style></head><body><div class="sw"><div style="background:var(--white);color:var(--ink)">Key cap<br>--white</div><div style="background:var(--steel);color:var(--ink)">Grey rubber<br>--steel</div><div style="background:var(--steel-3);color:var(--ink)">Steel dark<br>--steel-3</div><div style="background:var(--navy-light);color:var(--cream)">Navy light<br>--navy-light</div><div style="background:var(--navy);color:var(--cream)">Navy<br>--navy</div><div style="background:var(--navy-deep);color:var(--cream)">Navy deep<br>--navy-deep</div></div></body></html>
