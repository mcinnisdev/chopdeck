<!-- @dsCard group="Colors" viewport="700x130" name="LED status" subtitle="Only LEDs carry status colour — red rec, green play, amber attention" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.led{display:flex;gap:28px;align-items:center;margin-top:10px}.d{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px}</style></head><body><div class="sw"><div style="background:var(--led-red);color:var(--ink)">Rec<br>--led-red</div><div style="background:var(--led-green);color:var(--ink)">Play<br>--led-green</div><div style="background:var(--led-amber);color:var(--ink)">Attention<br>--led-amber</div><div style="background:var(--led-off);color:var(--cream)">Off<br>--led-off</div></div><div class="led k"><span><i class="d" style="background:var(--led-red);box-shadow:var(--led-glow-red)"></i>REC</span><span><i class="d" style="background:var(--led-green);box-shadow:var(--led-glow-green)"></i>PLAY</span><span><i class="d" style="background:var(--led-amber);box-shadow:var(--led-glow-amber)"></i>OPEN WINDOW</span><span><i class="d" style="background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)"></i>OFF</span></div></body></html>
