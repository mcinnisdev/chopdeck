<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}</style></head><body><div class="sw"><div style="background:var(--lcd);color:var(--ink)">LCD glass<br>--lcd</div><div style="background:var(--lcd-2);color:var(--ink)">LCD shade<br>--lcd-2</div><div style="background:var(--lcd-dim);color:var(--cream)">LCD dim<br>--lcd-dim</div><div style="background:var(--lcd-cursor);color:var(--cream)">Cursor<br>--lcd-cursor</div><div style="background:var(--lcd-ink);color:var(--cream)">LCD ink<br>--lcd-ink</div></div></body></html>
