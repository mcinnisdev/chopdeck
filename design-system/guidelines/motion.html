<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}</style></head><body><div style="display:flex;gap:32px" class="k"><span>--dur-press 40ms<br><br>cap sinks, shadow drops</span><span>--dur-led 120ms<br><br>LED glow on/off</span><span>--dur-lcd 0ms<br><br>LCD redraws instantly</span><span>--ease-hw cubic-bezier(.2,.9,.3,1)<br><br>only easing used</span><span>hover<br><br>none — hardware has no hover</span></div></body></html>
