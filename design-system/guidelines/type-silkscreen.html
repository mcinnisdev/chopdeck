<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.t{display:flex;flex-direction:column;gap:12px}.t span{font-family:var(--font-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1}</style></head><body><div class="t"><span style="font-size:var(--label-xs)">xs 9px · TAP TEMPO / NOTE REPEAT</span><span style="font-size:var(--label-sm)">sm 10px · MIDI PRODUCTION CENTER</span><span style="font-size:var(--label-md)">md 12px · PAD BANK — LOCATE — MODE</span><span style="font-size:var(--label-lg)">lg 14px · INTEGRATED RHYTHM MACHINE</span><span style="font-size:var(--label-xl)">xl 18px · 16 BIT DRUM SAMPLER</span><span class="k">--font-label · substitute for a real condensed industrial face</span></div></body></html>
