<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.h{display:flex;gap:24px;align-items:flex-end}.h span{display:flex;flex-direction:column;gap:6px;align-items:center}.h i{display:block;border:2px solid var(--ink)}</style></head><body><div class="h"><span><i style="width:var(--pad-size);height:var(--pad-size);background:var(--red);border-radius:var(--radius-pad)"></i><b class="k">pad 72 · gap 10</b></span><span><i style="width:var(--key-w);height:var(--key-h);background:var(--white);border-radius:var(--radius-key)"></i><b class="k">key 34×18</b></span><span><i style="width:var(--key-lg-w);height:var(--key-lg-h);background:var(--white);border-radius:var(--radius-key)"></i><b class="k">key lg 44×26</b></span><span><i style="width:var(--knob-md);height:var(--knob-md);background:var(--ink);border-radius:50%"></i><b class="k">knob 56</b></span><span><i style="width:var(--knob-lg);height:var(--knob-lg);background:var(--ink);border-radius:50%"></i><b class="k">knob lg 96</b></span><span><i style="width:var(--led-size);height:var(--led-size);background:var(--led-red);border-radius:50%;box-shadow:var(--led-glow-red)"></i><b class="k">led 6</b></span></div></body></html>
