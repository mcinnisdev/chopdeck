<!-- @dsCard group="Colors" viewport="700x150" name="Semantic surfaces" subtitle="Which base colour each surface role resolves to" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g div{height:52px;border:2px solid var(--ink);border-radius:3px;padding:6px;font:600 10px/1.3 var(--font-label);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div class="g"><div style="background:var(--surface-app-bg);color:var(--cream)">--surface-app-bg</div><div style="background:var(--surface-chassis);color:var(--cream)">--surface-chassis</div><div style="background:var(--surface-panel)">--surface-panel</div><div style="background:var(--surface-panel-recessed)">--surface-panel-recessed</div><div style="background:var(--surface-lcd)">--surface-lcd</div><div style="background:var(--surface-key)">--surface-key</div><div style="background:var(--surface-pad)">--surface-pad</div><div style="background:var(--surface-pad-alt)">--surface-pad-alt</div></div></body></html>
