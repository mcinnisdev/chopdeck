<!-- @dsCard group="Brand" viewport="700x170" name="Bevels & press states" subtitle="Hard 0-blur drop = physical height; pressing removes it and sinks the cap" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--cream);font-family:var(--font-body)}.sw{display:flex;gap:8px}.sw div{flex:1;height:64px;border:2px solid var(--ink);border-radius:var(--radius-key);display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase}.k{font:600 10px/1 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.b{display:flex;gap:28px;align-items:flex-end}.b span{display:flex;flex-direction:column;gap:8px;align-items:center}.b i{display:block;border:2px solid var(--ink)}</style></head><body><div class="b"><span><i style="width:44px;height:26px;background:#fff;border-radius:3px;box-shadow:var(--bevel-key)"></i><b class="k">key rest</b></span><span><i style="width:44px;height:26px;background:#fff;border-radius:3px;box-shadow:var(--bevel-key-pressed);transform:translateY(2px)"></i><b class="k">key pressed</b></span><span><i style="width:64px;height:64px;background:var(--red);border-radius:6px;box-shadow:var(--bevel-pad)"></i><b class="k">pad rest</b></span><span><i style="width:64px;height:64px;background:var(--red-soft);border-radius:6px;box-shadow:var(--bevel-pad-pressed),var(--pad-glow);transform:translateY(3px)"></i><b class="k">pad hit</b></span><span><i style="width:56px;height:56px;background:radial-gradient(circle at 50% 35%,var(--ink-3),var(--ink) 70%);border-radius:50%;box-shadow:var(--bevel-knob)"></i><b class="k">knob</b></span><span><i style="width:120px;height:56px;background:var(--cream-2);border-radius:10px;box-shadow:var(--recess)"></i><b class="k">recess</b></span><span><i style="width:120px;height:56px;background:var(--lcd);border-radius:2px;box-shadow:var(--lcd-inset)"></i><b class="k">lcd inset</b></span></div></body></html>
