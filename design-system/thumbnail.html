<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}body{display:grid;grid-template-columns:1fr 240px}.main{background:var(--cream);display:grid;place-items:center}.main img{width:520px;height:520px;object-fit:contain}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div:nth-child(1){background:var(--led-amber)}.strip div:nth-child(2){background:var(--lcd)}.strip div:nth-child(3){background:var(--red)}.strip div:nth-child(4){background:var(--navy)}</style></head>
<body><div class="main"><img src="assets/logo.webp" alt="Chop Deck"></div><div class="strip"><div></div><div></div><div></div><div></div></div></body></html>
